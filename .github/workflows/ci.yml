# L'intégration continue de Quiz M9. GitHub exécute ce fichier à chaque push.
#
# Deux travaux (jobs), chacun sur une machine neuve :
#   test   démarre un PostgreSQL à côté, installe le projet et lance
#          `npm test`. Rouge : le push a cassé quelque chose.
#   image  construit les deux images Docker et les publie dans le registre
#          de GitHub (ghcr.io). Il ne tourne que si `test` a réussi, et
#          seulement sur la branche main : une régression ne produit jamais
#          d'image.

name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    # Un conteneur de service : le même postgres:17 que compose.yml, démarré
    # avant les steps et joignable sur localhost:5432. Les tests créent leurs
    # bases temporaires dedans.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quizm9
          POSTGRES_PASSWORD: quizm9
          POSTGRES_DB: quizm9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizm9"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Ce qu'un coéquipier ferait sur une machine vide.
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://quizm9:quizm9@localhost:5432/quizm9

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publier dans ghcr.io
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN est fourni par GitHub à chaque exécution : pas de secret
      # à créer. Le nom du propriétaire doit être en minuscules pour ghcr.io.
      - name: Se connecter au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Deux tags par image : `latest`, qui bouge à chaque push, et
      # `sha-xxxxxxx`, qui ne bougera jamais. Le serveur choisira.
      - name: Construire et publier les images
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}

          docker build -f server/Dockerfile \
            -t ghcr.io/$OWNER/quizm9-api:latest \
            -t ghcr.io/$OWNER/quizm9-api:$SHA .
          docker push --all-tags ghcr.io/$OWNER/quizm9-api

          docker build -f client/Dockerfile \
            -t ghcr.io/$OWNER/quizm9-client:latest \
            -t ghcr.io/$OWNER/quizm9-client:$SHA .
          docker push --all-tags ghcr.io/$OWNER/quizm9-client
