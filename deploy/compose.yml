# Quiz M9 sur une machine où il n'y a que Docker : pas de code source, pas
# de build. Les images viennent du registre ; les valeurs propres à la
# machine viennent d'un fichier .env posé à côté (voir .env.example).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quizm9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quizm9
    # Pas de ports : seule l'API, sur le réseau privé, parle à la base.
    volumes:
      - quizm9-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizm9"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    image: ghcr.io/${OWNER}/quizm9-api:${TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://quizm9:${POSTGRES_PASSWORD}@postgres:5432/quizm9
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ghcr.io/${OWNER}/quizm9-client:${TAG:-latest}
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:3000
    depends_on:
      - api

volumes:
  quizm9-pgdata:
